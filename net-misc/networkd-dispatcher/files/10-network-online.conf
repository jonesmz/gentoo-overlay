# Drop-in installed by net-misc/networkd-dispatcher (this overlay).
#
# Order the dispatcher after the network is actually usable, so that hooks run
# via --run-startup-triggers (and hooks reacting to early boot transitions)
# have a routable link, working name resolution, and a synced clock available.
#
# network-online.target only has real effect when a wait-online service is
# enabled, e.g.:
#     systemctl enable systemd-networkd-wait-online.service
# Without it this ordering is a no-op barrier and the dispatcher starts as
# before; hooks that talk to remote services should still tolerate transient
# failures (e.g. net-dns/samba-ad-dns-register retries).
[Unit]
Wants=network-online.target
After=network-online.target systemd-resolved.service nss-lookup.target time-sync.target
