# Command line options for the networkd-dispatcher daemon. This file is the
# EnvironmentFile for networkd-dispatcher.service; the value below is appended
# to ExecStart as $networkd_dispatcher_args.
#
# --run-startup-triggers: on daemon start, run the hooks matching each link's
# CURRENT operational state, instead of only firing on a future state
# transition. Without it, a link that is already "routable" when the dispatcher
# starts (at boot, or after 'systemctl restart systemd-networkd') never runs
# its routable.d/ hooks. This overlay ships it on by default so state-sync
# hooks (e.g. net-dns/samba-ad-dns-register) fire at boot and on restart.
networkd_dispatcher_args="--run-startup-triggers"
